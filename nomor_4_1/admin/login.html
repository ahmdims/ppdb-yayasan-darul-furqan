<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin — Darul Furqan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/style.css"/>
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-logo" style="width:60px;height:60px;font-size:1.4rem;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10b981,#047857);border-radius:14px;">DF</div>
        <h2>Admin Panel</h2>
        <p>Yayasan Darul Furqan Pariaman</p>
      </div>
      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label style="font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:.35rem;display:block;">Email</label>
          <div class="login-input-wrap">
            <span class="login-input-icon">✉️</span>
            <input type="email" class="login-input" placeholder="admin@darulfurqan.sch.id" required/>
          </div>
        </div>
        <div class="form-group">
          <label style="font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:.35rem;display:block;">Password</label>
          <div class="login-input-wrap">
            <span class="login-input-icon">🔒</span>
            <input type="password" class="login-input" placeholder="••••••••" required/>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:-.25rem;">
          <label style="display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:rgba(255,255,255,.6);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--primary);"/> Ingat saya
          </label>
          <a href="#" style="font-size:.82rem;color:var(--primary-light);">Lupa password?</a>
        </div>
        <button type="submit" class="login-btn">Masuk →</button>
      </form>
      <div class="login-footer">
        <a href="../index.html">← Kembali ke Website</a>
      </div>
    </div>
  </div>
  <script src="../assets/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
