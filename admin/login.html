<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin — Darul Furqan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/style.css"/>
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/logo.png" class="brand-logo-img" alt="Logo Darul Furqan" />
        <h2>Admin Panel</h2>
        <p>Yayasan Darul Furqan Pariaman</p>
      </div>
      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label style="font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:.35rem;display:block;">Email</label>
          <div class="login-input-wrap">
            <span class="login-input-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"/><path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"/></svg></span>
            <input type="email" class="login-input" placeholder="admin@darulfurqan.sch.id" required/>
          </div>
        </div>
        <div class="form-group">
          <label style="font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:.35rem;display:block;">Password</label>
          <div class="login-input-wrap">
            <span class="login-input-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/></svg></span>
            <input type="password" class="login-input" placeholder="••••••••" required/>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:-.25rem;">
          <label style="display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:rgba(255,255,255,.6);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--primary);"/> Ingat saya
          </label>
          <a href="#" style="font-size:.82rem;color:var(--primary-light);">Lupa password?</a>
        </div>
        <button type="submit" class="login-btn">Masuk →</button>
      </form>
      <div class="login-footer">
        <a href="../index.html">← Kembali ke Website</a>
      </div>
    </div>
  </div>
  <script src="../assets/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
